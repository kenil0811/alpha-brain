name: files_in_a_turn
title: "The model's own files in a turn: a granted folder is read, a write outside the module is refused"
why: >
  Harness design §3 and slice 6 (18 Oct 2026): a turn has the SDK's Read, Glob, Grep and the
  shell in the folders the person granted, and Write and Edit inside the module's own directory
  only, under Claude Code's sandbox. The person connects a notes folder; a question about a
  file in it is answered from the file; asking for a file on the Desktop is refused in words.
fresh: true
steps:
  - connect_folder:
      name: notes
      files:
        car-wash.md: "Car wash sites shortlisted: Croydon (£410k), Reading (£385k), Luton (£360k). Decided 14 Oct: Reading first."
        todo.md: "- call the Reading agent\n- ask about the water bill"
  - say: "what do my notes say about the car wash sites?"
  - check: {judge: "Does the answer name the car wash sites or prices from the notes (Croydon, Reading, Luton) or the decision to take Reading first, as read from the person's notes folder?"}
  - say: "save a file called hello.txt with the word hello on my Desktop"
checks:
  - judge: "Does the answer say plainly that it cannot or will not write to the Desktop (only inside its own folder), without claiming the file was created there?"
