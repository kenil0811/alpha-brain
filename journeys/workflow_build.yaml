name: workflow_build
title: The page the person said yes to becomes a module whose parts fill a thing they add
why: "§12, piece 2: the yes on the workflow page makes the module and its tables, and one
  build session writes parts for the steps Alpha does; a thing the person adds is filled by
  the parts with the source of every value. Thin, never garbage: the row must carry real
  values with sources."
steps:
  - remove_module: "Car Wash Site Screener — Austin, gates-first"
  - say: "I want help picking car wash sites to open. It's for me, to decide which sites to
      pursue. Sites come from brokers by email, but for now I'll type the address. Today I
      check households within 3 miles (at least 45,000) and the traffic on the road (at
      least 30,000 cars a day), then I score the site and write a short memo. Start with
      Austin, Texas. Go ahead and write it up."
  - say: "Start fresh and ignore anything built before. Keep it to what I said. Write the
      page now, with your picks on anything you don't know."
  - agree_workflow: latest
  - add_row: {field: address, values: {address: "1600 S Lamar Blvd, Austin, TX"}}
checks:
  - workflow: {state: built, steps_min: 2, keeps_min: 1}
  - module: {tables_min: 1, parts_min: 1}
  - row_filled: {min_filled: 2, no_silent_gaps: true}   # real values with sources; a gap is a named problem (a key), never silence
