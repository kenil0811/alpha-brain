name: question_card
title: A question Alpha needs answered is a card, asked through its own hand
why: "Q35 (9 Oct) made cards out of questions left in prose, by parsing; Q78 (18 Oct) ended
  that: a card comes only from ask_person or a mechanism (a permission, a routing). So the
  model must ask through its hand when the answer changes what it does: \"Log my lunch\" has
  nothing to log until it knows what."
steps:
  - say: "Log my lunch"
checks:
  - ask: {derived: false}
