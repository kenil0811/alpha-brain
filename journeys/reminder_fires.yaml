name: reminder_fires
title: "First day · \"remind me to call Sara on Friday\" is a reminder that fires"
why: >
  The harness design's §17, sentence 5. A reminder is a row with a moment (18 Oct 2026, Kenil:
  never an agent of its own); the Reminders agent puts one card when the moment comes
  (Done · Tomorrow, same time). The suite cannot wait until Friday, so it brings the moment to
  now and runs the agent.
fresh: true
steps:
  - say: "remind me to call Sara on Friday"
    home: true
  - check: {made_since: {agents: 0}}
  - due_now: {}
  - agent: "Reminders"
checks:
  - journal: {kind: asked, contains: "Reminder: call Sara"}
  - run_verdict: {}
