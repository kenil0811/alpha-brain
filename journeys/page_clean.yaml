name: page_clean
title: "A clean page: the chart asked for lands on the module's own page, drawn with the kit, and Alpha's look says clean"
why: >
  Harness slice 7b (18 Oct 2026). Kenil on the first page the model drew: "it's not clean, and
  it also created a new summary page". So: "add a line chart to the summary page" must add to
  the module's own page (overview), not open a tab; the chart must be the kit's, not hand-drawn;
  and Alpha must look at the result and find it clean before it answers.
fresh: true
steps:
  - say: "track what I eat: a food log with the date, the item, calories and protein in grams"
  - say: >-
      log these for the last week: Mon 12 Oct oats 350 kcal 12 g protein, chicken salad 520 kcal
      42 g; Tue 13 Oct eggs 300 kcal 20 g, pasta 700 kcal 25 g; Wed 14 Oct yoghurt 200 kcal 15 g,
      steak 650 kcal 55 g; Thu 15 Oct toast 280 kcal 8 g, curry 800 kcal 30 g; Fri 16 Oct smoothie
      320 kcal 18 g, pizza 900 kcal 35 g; Sat 17 Oct pancakes 450 kcal 10 g, salmon 600 kcal 45 g;
      Sun 18 Oct granola 400 kcal 12 g, soup 350 kcal 14 g
  - check: {rows_since: {at_least: 14}}
  - say: "add a line chart of my daily calories and protein to the summary page, one line each"
checks:
  - page: {module: Food, name: overview, front: true, count: 1, rows: 7, kit: true}
  - page_look: {module: Food}
  - journal: {kind: checked, contains: "looked at the page"}
  - judge: "Does the answer say the chart was added to the module's page (its summary or overview) in plain words, without asking the person to do anything first?"
