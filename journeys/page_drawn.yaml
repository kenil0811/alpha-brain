name: page_drawn
title: "A page the model draws: a line chart of daily calories and protein, the module's front"
why: >
  Harness design §5 and Q62; slice 7 (18 Oct 2026). Kenil asked for custom UI when the tables'
  views cannot show what he wants ("a line chart with daily intake stats on the summary page",
  refused on 18 Oct because the model had no way to draw). A week of food is logged; the
  request is a summary page with two lines; the page must exist with a header that runs, hold
  a drawing, read seven days, and be what the module opens on.
fresh: true
steps:
  - say: "track what I eat: a food log with the date, the item, calories and protein in grams"
    home: true
  - say: >-
      log these for the last week: Mon 12 Oct oats 350 kcal 12 g protein, chicken salad 520 kcal
      42 g; Tue 13 Oct eggs 300 kcal 20 g, pasta 700 kcal 25 g; Wed 14 Oct yoghurt 200 kcal 15 g,
      steak 650 kcal 55 g; Thu 15 Oct toast 280 kcal 8 g, curry 800 kcal 30 g; Fri 16 Oct smoothie
      320 kcal 18 g, pizza 900 kcal 35 g; Sat 17 Oct pancakes 450 kcal 10 g, salmon 600 kcal 45 g;
      Sun 18 Oct granola 400 kcal 12 g, soup 350 kcal 14 g
    home: true
  - check: {rows_since: {at_least: 14}}
  - say: "make a summary page for Food with a line chart of my daily calories and protein, one line each, and make it the page the module opens on"
    home: true
checks:
  - page: {module: Food, front: true, rows: 7}
  - judge: "Does the answer say a page was made (a summary page or chart) in plain words, without asking the person to do anything first?"
