name: vague_tracker
title: A vague tracker ask gets a thin first version now, with its defaults named, not an interview
why: On 2 Oct Alpha built nine tables and eight readers blind for "a live daily tracker" and
  ran out of time; from 11 Oct every tracker ask went to an interview and a page. Since 17 Oct
  (the harness, Q58, Q67) a thin first version is made in the turn with its defaults said, and
  the improvements follow; the page is for a big job only.
fresh: true
steps:
  - say: "i want to keep track of all the ai conferences happening in london this year"
checks:
  - made_since: {tables: 1}
  - reply: {matches: "conference"}
