name: workflow_interview
title: A module ask is interviewed, then drafted as "Your workflow" in the person's words
why: "§12 (Q39): after three car wash builds that started from the domain, a module starts
  from the person's own procedure. A vague ask gets the interview's questions as cards; once
  the job and the procedure are known, Alpha drafts the workflow page (steps with who does
  each, what it keeps as related things, settings with origins, suggestions) and nothing is
  built; a change said in chat is a new version with the old one kept."
steps:
  - remove_module: "Car Wash Site Screener — Austin, gates-first"   # the Q38 module; the ask is afresh
  - say: "I want help picking car wash sites to open"
  - say: "It's for me, to decide which sites to pursue and brief my investors. Sites come from
      brokers by email. Today I check households within 3 miles, density, drive-time
      population, the traffic on the road and at the main intersection, then I score
      fourteen things like visibility and access from 1 to 10 with a note each, and write a
      memo to investors. Thresholds: 45,000 households, 30,000 cars a day. Start with Austin.
      Go ahead and write it up."
checks:
  - workflow: {state: drafted, steps_min: 3, keeps_min: 2, suggestions_min: 1}
  - no_new_tables: {}
  - no_new_modules: {}
steps_after:
  - say: "Add a minimum lot size of 0.8 acres as one of the checks."
checks_after:
  - workflow: {state: drafted, version: 2}
  - no_new_tables: {}
