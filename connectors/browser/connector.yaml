name: browser
title: Browser
description: Web pages read the way you see them, including sites you signed into in Alpha's browser.
provider: chrome
version: 1
origin: builtin
transport: browser
auth:
  kind: browser-session
  profile: per-site, under the data directory; the person signs in themselves
tools:
  - {name: page_read, effect: read, description: Read a page (title, text, links); signed in when the person connected the site.}
  - {name: page_script, effect: read, description: Run Alpha's own read-only script in a page; requests that would change data are blocked while it runs.}
  - {name: page_to_table, effect: read, description: A first look at a list on a page, into a table; a site's reader replaces it.}
  - {name: reader_save, effect: read, description: Keep a page script as a reader for one list on one site, after it worked on the real page.}
  - {name: reader_run, effect: read, description: Run a saved reader into a table; health-checked before it writes.}
  - {name: skills_find, effect: read, description: The skills Alpha keeps (readers, procedures, pipelines) and how each is doing.}
  - {name: browser_signin, effect: read, description: Open a window on a site so the person can sign in.}
triggers: []
health: {repair: re-observe-page}
