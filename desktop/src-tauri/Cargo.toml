[package]
name = "alpha-desktop"
version = "0.1.0"
description = "Alpha's native host: the windows, the tray, the companion, and the core it supervises."
edition = "2021"
rust-version = "1.98"

[lib]
name = "alpha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Push-to-talk (Fn hold): Fn is a modifier flag, not a key a global-shortcut plugin can register,
# so ptt.rs drives a CGEventTap directly. Both crates are already in Cargo.lock (pulled in by
# tauri/wry), so this adds no new dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
