[project]
name = "alpha"
version = "0.1.0"
description = "Alpha's core: the world store, the pre-pack, the turn runtime and the MCP server that hands the world to the model."
requires-python = "==3.13.9"
dependencies = [
    "fastmcp==4.0.10",
    "mcp==2.2.0",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "pyobjc-framework-eventkit==12.0",
    "pypdf==6.1.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "watchdog==6.0.0",
]

[project.scripts]
alpha = "alpha.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha"]
